#
# Releases this action with itself (`uses: ./`): commit on main by helpers4-bot, tag, floating
# major tag, GitHub Release. Nothing is built: the action runs from its sources.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        type: boolean
        default: false

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: release
        uses: ./
        with:
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          app-id: ${{ vars.HELPERS4_BOT_ID }}
          app-key: ${{ secrets.HELPERS4_BOT_KEY }}
          version-files: package.json
          floating-major: true
          # The sources and tests use `@since next` as an example: never replace it.
          since-files: ""
      # The website documents this action (helpers4.dev/action/actions/action-release/) from the
      # README and docs/ of the released tag: tell it which repository and tag to read.
      - name: Trigger website update
        if: inputs.dry-run != true && steps.release.outputs.tag != ''
        continue-on-error: true
        uses: helpers4/action/dispatch-with-fallback@8ab0d9c2d162ad5c51c7f5c63d9a44f4e201e432 # main
        with:
          target-owner: helpers4
          target-repo: website
          event-type: action-release
          payload: '{"repo": "action-release", "version": "${{ steps.release.outputs.tag }}"}'
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}
