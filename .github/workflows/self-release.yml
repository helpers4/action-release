# Releases this action with itself. No tagged version of the action exists the first time, and
# dist/ is never committed on main, so the build job compiles it and the jobs below run the
# checkout with uses: ./. include-build puts dist/ in the release commit only.
name: Release this action

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Type of release
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        description: Stop before the tag is created
        type: boolean
        default: false

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: helpers4/action/setup-pnpm@215739f023134ab5ed2158607074084ec530a830
        with:
          node-version: "26"
      - run: pnpm run build
      - uses: ./
        with:
          mode: build
          bump: ${{ inputs.bump }}
          registries: none
          include-build: "true"
      # The compiled action travels to the publish job, which must not build anything itself.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-dist
          path: dist
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: action-dist
          path: dist
      - uses: ./
        with:
          mode: publish
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          registries: none
