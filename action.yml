name: helpers4 release
description: Version, changelog, release commit on main, tag, GitHub Release, and publication to npm, crates.io and JSR
author: helpers4
branding:
  icon: package
  color: blue

inputs:
  bump:
    description: auto, patch, minor, major, alpha, beta, rc or resume
    required: false
    default: auto
  dry-run:
    description: Prepare and verify everything (build, registry dry-runs), then stop before writing anything
    required: false
    default: "false"
  app-id:
    description: Client ID of the GitHub App allowed to push the release commit to the protected branch
    required: false
    default: ""
  app-key:
    description: Private key of that GitHub App
    required: false
    default: ""
  config:
    description: Path of the optional release configuration
    required: false
    default: .github/release.yml
  github-token:
    description: Token for the GitHub Release (the job needs contents write)
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: Released version
    value: ${{ steps.prepare.outputs.version }}
  tag:
    description: Release tag
    value: ${{ steps.prepare.outputs.tag }}
  release-url:
    description: URL of the GitHub Release
    value: ${{ steps.finalize.outputs.release-url }}

runs:
  using: composite
  steps:
    - name: Install the release engine
      shell: bash
      run: '"$GITHUB_ACTION_PATH/src/install.sh"'

    # state: new (a version to release), resume (released but incomplete), done (nothing left).
    - name: Prepare the release
      id: prepare
      shell: bash
      env:
        INPUT_BUMP: ${{ inputs.bump }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_CONFIG: ${{ inputs.config }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/main.ts" prepare

    - name: Build and dry-run every target
      if: steps.prepare.outputs.state != 'done'
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_HAS_APP: ${{ inputs.app-id != '' && inputs.app-key != '' }}
      run: node "$GITHUB_ACTION_PATH/src/main.ts" verify

    # Created only now, after the project's code has run, and limited to this repository.
    - name: Get the token of the App
      id: app
      if: steps.prepare.outputs.state == 'new' && inputs.dry-run != 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write

    - name: Commit to the branch, tag, draft the Release
      if: steps.prepare.outputs.state == 'new' && inputs.dry-run != 'true'
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app.outputs.token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/main.ts" commit

    - name: Authenticate to crates.io
      id: crates
      if: steps.prepare.outputs.state != 'done' && inputs.dry-run != 'true' && steps.prepare.outputs.crates == 'true'
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

    - name: Publish
      if: steps.prepare.outputs.state != 'done' && inputs.dry-run != 'true'
      shell: bash
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/main.ts" publish

    - name: Publish the Release
      id: finalize
      if: steps.prepare.outputs.state != 'done' && inputs.dry-run != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/main.ts" finalize
